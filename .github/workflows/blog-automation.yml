name: AI Blog Automation

# Scheduled runs (every 12h) = generate at most the velocity-capped number of new
# posts, run READ-ONLY reports/gates, rebuild, deploy.
# Anything that deletes, retires, strips or LLM-rewrites EXISTING posts only runs on
# manual dispatch with `destructive: true`, so published content cannot churn
# unattended (churn also resets updated_at and fakes freshness).
# A push to main only rebuilds and deploys; it never generates or mutates content.

on:
    schedule:
        - cron: "0 */12 * * *"
    workflow_dispatch:
        inputs:
            destructive:
                description: "Run deletion / retirement / fabrication-strip / LLM-rewrite steps"
                required: false
                default: false
                type: boolean
            force_cleanup:
                description: "Run `blog_system.py cleanup`"
                required: false
                default: false
                type: boolean
            improve_limit:
                description: "Posts LLM-rewritten this run (destructive only; 0 = all remaining)"
                required: false
                default: "5"
            triage_max_deletions:
                description: "Max DELETE-verdict posts removed this run (destructive only)"
                required: false
                default: "10"
            regenerate_og_only:
                description: "Only regenerate OG images (skip content generation)"
                required: false
                default: false
                type: boolean

    push:
        branches: [main]

env:
    FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    # true only for a manual dispatch that explicitly opted in
    DESTRUCTIVE: ${{ github.event_name == 'workflow_dispatch' && inputs.destructive == true }}

permissions:
    contents: write
    pages: write
    id-token: write

concurrency:
    group: "pages"
    cancel-in-progress: false

jobs:
    generate-and-deploy:
        runs-on: ubuntu-latest
        timeout-minutes: 25
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4
              with:
                  token: ${{ secrets.GITHUB_TOKEN }}
                  fetch-depth: 0 # required: blog_post.py derives dates from git history

            - name: Set up Python
              uses: actions/setup-python@v5
              with:
                  python-version: "3.11"
                  cache: "pip"

            - name: Install dependencies
              run: |
                  python -m pip install --upgrade pip
                  pip install -r requirements.txt
                  pip install --quiet scikit-learn numpy

            - name: Pull latest changes
              run: |
                  git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
                  git config --local user.name "github-actions[bot]"
                  git fetch origin main
                  git reset --hard origin/main

            - name: Verify secrets
              run: |
                  for VAR in GROQ_API_KEY GEMINI_API_KEY OPENROUTER_API_KEY \
                             CEREBRAS_API_KEY MISTRAL_API_KEY NVIDIA_API_KEY \
                             TWITTER_API_KEY TWITTER_API_SECRET \
                             TWITTER_ACCESS_TOKEN TWITTER_ACCESS_TOKEN_SECRET \
                             TWITTER_BEARER_TOKEN BLOGGITHUB_TOKEN HF_TOKEN ZAI_API_KEY LLM7_API_KEY DEEPSEEK_API_KEY ENABLE_TWITTER_POSTING; do
                    if [ -z "${!VAR}" ]; then echo "WARNING: $VAR is not set"; else echo "OK: $VAR is set"; fi
                  done
              env:
                  GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
                  GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
                  OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
                  CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
                  MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
                  NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
                  TWITTER_API_KEY: ${{ secrets.TWITTER_API_KEY }}
                  TWITTER_API_SECRET: ${{ secrets.TWITTER_API_SECRET }}
                  TWITTER_ACCESS_TOKEN: ${{ secrets.TWITTER_ACCESS_TOKEN }}
                  TWITTER_ACCESS_TOKEN_SECRET: ${{ secrets.TWITTER_ACCESS_TOKEN_SECRET }}
                  TWITTER_BEARER_TOKEN: ${{ secrets.TWITTER_BEARER_TOKEN }}
                  BLOGGITHUB_TOKEN: ${{ secrets.BLOGGITHUB_TOKEN }}
                  HF_TOKEN: ${{ secrets.HF_TOKEN }}
                  ZAI_API_KEY: ${{ secrets.ZAI_API_KEY }}
                  LLM7_API_KEY: ${{ secrets.LLM7_API_KEY }}
                  DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
                  ENABLE_TWITTER_POSTING: ${{ secrets.ENABLE_TWITTER_POSTING }}

            - name: Resolve Twitter posting flag
              id: twitter_flag
              run: |
                  EVENT="${{ github.event_name }}"
                  SECRET_FLAG="${{ secrets.ENABLE_TWITTER_POSTING }}"
                  if [ "$EVENT" = "schedule" ]; then
                    echo "effective_flag=true" >> $GITHUB_OUTPUT
                  elif [ "$EVENT" = "push" ]; then
                    echo "effective_flag=false" >> $GITHUB_OUTPUT
                  else
                    NORMALISED=$(echo "$SECRET_FLAG" | tr '[:upper:]' '[:lower:]' | xargs)
                    if [ "$NORMALISED" = "true" ]; then echo "effective_flag=true" >> $GITHUB_OUTPUT; else echo "effective_flag=false" >> $GITHUB_OUTPUT; fi
                  fi

            - name: Initialize config if needed
              run: |
                  [ -f "config.yaml" ] && echo "Config exists" || python blog_system.py init

            - name: Conditional cleanup (manual only)
              if: github.event_name == 'workflow_dispatch' && inputs.force_cleanup == true
              run: python blog_system.py cleanup

            - name: Restore trending hashtag cache
              run: |
                  git fetch origin main
                  git checkout origin/main -- .trending_hashtag_cache.json 2>/dev/null || true

            # Never on push: a manual commit must not generate or publish content.
            - name: Generate new blog content (velocity-capped)
              if: github.event_name != 'push' && github.event.inputs.regenerate_og_only != 'true'
              timeout-minutes: 12
              continue-on-error: true
              env:
                  GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
                  GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
                  OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
                  CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
                  MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
                  NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
                  TWITTER_API_KEY: ${{ secrets.TWITTER_API_KEY }}
                  TWITTER_API_SECRET: ${{ secrets.TWITTER_API_SECRET }}
                  TWITTER_ACCESS_TOKEN: ${{ secrets.TWITTER_ACCESS_TOKEN }}
                  TWITTER_ACCESS_TOKEN_SECRET: ${{ secrets.TWITTER_ACCESS_TOKEN_SECRET }}
                  TWITTER_BEARER_TOKEN: ${{ secrets.TWITTER_BEARER_TOKEN }}
                  BLOGGITHUB_TOKEN: ${{ secrets.BLOGGITHUB_TOKEN }}
                  HF_TOKEN: ${{ secrets.HF_TOKEN }}
                  ZAI_API_KEY: ${{ secrets.ZAI_API_KEY }}
                  LLM7_API_KEY: ${{ secrets.LLM7_API_KEY }}
                  DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
                  ENABLE_TWITTER_POSTING: ${{ steps.twitter_flag.outputs.effective_flag }}
                  ENTITY_VERIFY_ONLINE: "1"
              run: |
                  python blog_system.py auto || {
                    echo "WARNING: Content generation failed — rebuilding existing content"
                    python blog_system.py build
                  }

            - name: Build site (push / OG-only)
              if: github.event_name == 'push' || github.event.inputs.regenerate_og_only == 'true'
              run: python blog_system.py build

            - name: Verify generated content
              run: |
                  post_count=$(find docs -name "post.json" 2>/dev/null | wc -l)
                  echo "Total posts: $post_count"
                  [ -f "docs/index.html" ] || { echo "ERROR: no index.html"; exit 1; }

            # ── READ-ONLY gates and reports (safe on every run) ─────────────────
            - name: 📊 Full-corpus content quality gate (report only)
              run: |
                  python scripts/quality_gate.py \
                    --docs-dir ./docs --min-score 50 \
                    --csv ./quality_report_full.csv --queue ./regeneration_queue.json

            - name: 🧮 Code-driven triage (report only)
              continue-on-error: true
              run: python scripts/content_triage.py --docs ./docs --out ./triage_out --max-delete-fraction 1.0

            - name: 🔎 Retroactive fabrication audit (queue only)
              run: |
                  python scripts/retroactive_fabrication_audit.py \
                    --docs-dir ./docs --queue ./regeneration_queue.json

            - name: 🔢 Prioritize fabrication queue by severity
              run: |
                  python scripts/prioritize_regeneration_queue.py \
                    --queue ./regeneration_queue.json --confirm

            - name: 🔗 Full-corpus internal link audit (report only)
              run: |
                  python -c "
                  from pathlib import Path
                  from adsense_fixes.link_validator import audit_all_internal_links
                  report = audit_all_internal_links(Path('./docs'))
                  print(report)
                  open('link_audit_report.txt', 'w').write(report)
                  "

            # Always-on, idempotent and non-destructive: removes visible
            # "[CLAIM REMOVED ...]" placeholders left by earlier cleanup runs.
            - name: 🧽 Purge visible placeholder markers
              run: python adsense_credibility_cleanup.py purge-markers --apply

            # Metadata-only + idempotent: rewrites post.json `tags` to the controlled
            # taxonomy (taxonomy.py). Never touches content/updated_at, so no churn.
            - name: 🏷️ Normalise tags to controlled taxonomy
              run: python scripts/retag_posts.py --docs ./docs --apply

            # Deterministic (no LLM) DELETE / IMPROVE / KEEP verdicts for every post.
            - name: 🧮 Post verdicts (report only)
              run: python scripts/post_verdicts.py --docs ./docs --out "$RUNNER_TEMP/triage_verdicts"

            - name: Upload verdict report
              uses: actions/upload-artifact@v4
              with:
                  name: post-verdicts-${{ github.run_id }}
                  retention-days: 30
                  path: ${{ runner.temp }}/triage_verdicts

            # ── DESTRUCTIVE / REWRITE STEPS: manual dispatch with destructive=true ─
            - name: 🧹 Auto-retire confirmed duplicate posts (bounded)
              if: env.DESTRUCTIVE == 'true'
              run: |
                  python scripts/auto_retire_duplicates.py \
                    --docs-dir ./docs --max-deletions 2 --min-score 0.50 \
                    --backup-dir ./.duplicate_backups \
                    --base-url "https://kubailabs.com" --confirm

            - name: 🧹 Process fabrication regeneration queue (bounded)
              if: env.DESTRUCTIVE == 'true'
              run: |
                  python scripts/process_regeneration_queue.py \
                    --docs-dir ./docs --queue ./regeneration_queue.json \
                    --max-posts 5 --backup-dir ./.fabrication_backups --confirm

            - name: 🧹 Process citation regeneration queue (bounded)
              if: env.DESTRUCTIVE == 'true'
              run: |
                  python scripts/process_citation_queue.py \
                    --docs-dir ./docs --queue ./citation_audit_report.json \
                    --max-posts 5 --backup-dir ./.citation_backups --confirm

            - name: 🧹 Strip remaining unsourced named citations
              if: env.DESTRUCTIVE == 'true'
              run: |
                  python adsense_credibility_cleanup.py scan
                  python adsense_credibility_cleanup.py delete-flagged --apply

            - name: 🧮 Review all posts (report only)
              if: env.DESTRUCTIVE == 'true'
              run: python triage.py --docs ./docs --out ./triage_report

            - name: 🗑️ Delete flagged posts + block their topics
              if: env.DESTRUCTIVE == 'true'
              run: |
                  python delete_posts.py --docs ./docs \
                    --max "${{ github.event.inputs.triage_max_deletions || '10' }}" \
                    --backup-dir ./.triage_backups --confirm

            - name: 🧮 Final triage (report only)
              if: env.DESTRUCTIVE == 'true'
              run: python scripts/final_triage.py --docs ./docs --queue ./regeneration_queue.json --out ./triage_final

            - name: 🗑️ Delete quarantined posts + block their topics (bounded)
              if: env.DESTRUCTIVE == 'true'
              run: |
                  if [ -s ./triage_final/delete.txt ]; then
                    python delete_posts.py --docs ./docs --list ./triage_final/delete.txt \
                      --max "${{ github.event.inputs.triage_max_deletions || '10' }}" \
                      --backup-dir ./.triage_backups --confirm
                  else
                    echo "No quarantined posts to delete"
                  fi

            - name: ✨ LLM-improve flagged posts
              if: env.DESTRUCTIVE == 'true'
              env:
                  GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
                  GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
                  OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
                  CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
                  MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
                  NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
                  HF_TOKEN: ${{ secrets.HF_TOKEN }}
                  ZAI_API_KEY: ${{ secrets.ZAI_API_KEY }}
                  LLM7_API_KEY: ${{ secrets.LLM7_API_KEY }}
                  DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
                  ENTITY_VERIFY_ONLINE: "1"
              run: |
                  python improve_posts.py --docs ./docs \
                    --limit "${{ github.event.inputs.improve_limit || '5' }}" --verify-online --confirm || \
                    echo "WARNING: improve_posts.py failed — continuing with the build"

            - name: 🧮 Stricter AdSense compliance audit (v3)
              if: env.DESTRUCTIVE == 'true'
              run: |
                  python adsense_compliance_audit.py --improve || echo "WARNING - compliance audit failed, continuing"

            # add_sources.py / post_enhancer.py remain DISABLED: keyword-mapped
            # "Official documentation" links were irrelevant on 99+ posts.

            # ── Final build, scope gates, indexing hygiene ──────────────────────
            - name: 🔁 Rebuild site
              run: |
                  python blog_system.py build
                  if [ -f ./docs/sitemap.xml ]; then
                    url_count=$(grep -o "<loc>" ./docs/sitemap.xml | wc -l | tr -d ' ')
                    echo "sitemap_url_count=${url_count}" >> $GITHUB_ENV
                  else
                    echo "sitemap_url_count=0" >> $GITHUB_ENV
                  fi

            - name: 🛡️ Ads scope gate (no ads on noindex / utility / thin pages)
              run: python adsense_fixes/ads_scope_gate.py --docs ./docs --min-words 1200

            - name: 🔒 Noindex + sitemap compliance audit
              run: |
                  python -c "
                  from pathlib import Path
                  from adsense_fixes.canonical_guard import audit_noindex_compliance
                  report = audit_noindex_compliance(Path('./docs'))
                  print(report)
                  open('noindex_audit_report.txt', 'w').write(report)
                  "
                  python scripts/generate_sitemap.py \
                    --output-dir ./docs --base-url "https://kubailabs.com" --validate-only

            - name: 🧭 Indexing hygiene gate (sitemap/404/redirect/noindex)
              run: python utilsIndexing/check_indexing_hygiene.py --docs ./docs --base https://kubailabs.com

            - name: 📸 Generate per-article OG images
              continue-on-error: true
              run: |
                  python scripts/generate_og_images.py \
                    --posts-dir ./docs --output-dir ./docs/static/og \
                    --base-url "https://kubailabs.com" --patch-html
                  og_count=$(ls ./docs/static/og/*.png 2>/dev/null | wc -l)
                  echo "og_image_count=${og_count}" >> $GITHUB_ENV

            # Destructive runs keep their pre-change copies for 30 days as a downloadable
            # artifact, so the public repo does not accumulate thousands of backup files.
            - name: Upload backups of removed/rewritten posts
              if: env.DESTRUCTIVE == 'true'
              uses: actions/upload-artifact@v4
              with:
                  name: post-backups-${{ github.run_id }}
                  retention-days: 30
                  if-no-files-found: ignore
                  include-hidden-files: true
                  path: |
                      .duplicate_backups
                      .fabrication_backups
                      .citation_backups
                      .triage_backups
                      .quality_review_backups
                      .sources_backups

            - name: Commit and push with retry
              run: |
                  git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
                  git config --local user.name "github-actions[bot]"
                  # Backup dirs are git-ignored (see .gitignore) and shipped as a workflow
                  # artifact instead. Never `git add` an ignored path by name: git exits 1.
                  git add -A
                  if git diff --staged --quiet; then
                    echo "Nothing to commit"
                  else
                    post_count=$(find docs -name "post.json" | wc -l)
                    og_count=$(ls ./docs/static/og/*.png 2>/dev/null | wc -l)
                    git commit -m "Auto-blog $(date '+%Y-%m-%d %H:%M') — ${post_count} posts + ${og_count} OG images + sitemap"
                    git push origin main || {
                      git fetch origin main
                      git rebase origin/main
                      git push origin main
                    }
                  fi

            - name: Setup GitHub Pages
              uses: actions/configure-pages@v5

            - name: Upload Pages artifact
              uses: actions/upload-pages-artifact@v3
              with:
                  path: ./docs

            # No continue-on-error: a failed deploy must fail the run, not pass silently.
            - name: Deploy to GitHub Pages
              id: deployment
              uses: actions/deploy-pages@v4

            - name: Summary
              if: always()
              run: |
                  post_count=$(find docs -name "post.json" | wc -l)
                  {
                    echo "## Deployment"
                    echo "| Metric | Value |"
                    echo "|--------|-------|"
                    echo "| URL | ${{ steps.deployment.outputs.page_url }} |"
                    echo "| Posts | $post_count |"
                    echo "| Sitemap URLs | ${{ env.sitemap_url_count }} |"
                    echo "| Trigger | ${{ github.event_name }} |"
                    echo "| Destructive steps | ${{ env.DESTRUCTIVE }} |"
                  } >> $GITHUB_STEP_SUMMARY
